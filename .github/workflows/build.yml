name: Website build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
      - run: npm run build
        env:
          CI: false
      - uses: actions/upload-artifact@v4
        with:
          name: ats-website
          path: build
